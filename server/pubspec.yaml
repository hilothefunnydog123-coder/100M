name: jobwalk_server
description: >-
  Jobwalk API: drafts quotes from job photos with Claude, hosts the quote
  links customers approve, and serves the landing page.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  http: ^1.6.0
  image: ^4.10.1
  jobwalk_core:
    path: ../packages/core
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
