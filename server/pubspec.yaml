name: spotcheck_server
description: >-
  SpotCheck analysis API. A stateless proxy that validates checks, asks
  Claude for a structured assessment, and applies the shared safety rules.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.7.0
  http: ^1.6.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  spotcheck_core:
    path: ../packages/core

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
